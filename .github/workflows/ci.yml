name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: python manage.py test
      - run: python manage.py migrate --run-syncdb --noinput
      - run: python manage.py seed_demo
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
  deployment:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-demo-password-not-for-production
      DJANGO_SECRET_KEY: ci-only-secret-key-with-more-than-fifty-random-characters
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose build api web
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none lib test
      - run: flutter analyze
      - run: flutter test
  windows-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet test tests/EDSanat.Windows.Tests/EDSanat.Windows.Tests.csproj --configuration Release
